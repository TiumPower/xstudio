vi:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d/%m"
      long: "%d tháng %m năm %Y"
    day_names: [Chủ nhật, Thứ hai, Thứ ba, Thứ tư, Thứ năm, Thứ sáu, Thứ bảy]
    abbr_day_names: [CN, T2, T3, T4, T5, T6, T7]
    month_names: [~, Tháng 1, Tháng 2, Tháng 3, Tháng 4, Tháng 5, Tháng 6, Tháng 7, Tháng 8, Tháng 9, Tháng 10, Tháng 11, Tháng 12]
    abbr_month_names: [~, Th1, Th2, Th3, Th4, Th5, Th6, Th7, Th8, Th9, Th10, Th11, Th12]
    order: ["day", "month", "year"]
  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d/%m %H:%M"
      long: "%H:%M ngày %d/%m/%Y"
      time_only: "%H:%M"
    am: "sáng"
    pm: "chiều"
  number:
    format:
      separator: ","
      delimiter: "."
      precision: 0
    currency:
      format:
        format: "%n %u"
        unit: "₫"
        separator: ","
        delimiter: "."
        precision: 0
    # `number.format.precision: 0` ở trên là cho tiền đồng (không có phần lẻ),
    # nhưng nó cũng rơi xuống number_to_human_size — làm 25MB hiện thành
    # "30 MB". Trả về mặc định của Rails cho nhóm số "dễ đọc".
    human:
      format:
        precision: 3
        significant: true
        strip_insignificant_zeros: true
  support:
    array:
      words_connector: ", "
      two_words_connector: " và "
      last_word_connector: " và "

  datetime:
    distance_in_words:
      less_than_x_seconds:
        one: "vài giây"
        other: "%{count} giây"
      x_seconds:
        one: "1 giây"
        other: "%{count} giây"
      less_than_x_minutes:
        one: "chưa tới 1 phút"
        other: "chưa tới %{count} phút"
      x_minutes:
        one: "1 phút"
        other: "%{count} phút"
      about_x_hours:
        one: "khoảng 1 giờ"
        other: "khoảng %{count} giờ"
      x_days:
        one: "1 ngày"
        other: "%{count} ngày"
      about_x_months:
        one: "khoảng 1 tháng"
        other: "khoảng %{count} tháng"
      x_months:
        one: "1 tháng"
        other: "%{count} tháng"
      about_x_years:
        one: "khoảng 1 năm"
        other: "khoảng %{count} năm"
      over_x_years:
        one: "hơn 1 năm"
        other: "hơn %{count} năm"
      almost_x_years:
        one: "gần 1 năm"
        other: "gần %{count} năm"

