# Tên miền cũ — 301 vĩnh viễn sang xstudio.tiumpower.com.
server {
  listen 80;
  server_name xstudio.czin.net;
  return 301 https://xstudio.tiumpower.com$request_uri;
}
server {
  listen 443 ssl http2;
  server_name xstudio.czin.net;
  ssl_certificate     /etc/letsencrypt/live/xstudio.czin.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/xstudio.czin.net/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://xstudio.tiumpower.com$request_uri;
}
