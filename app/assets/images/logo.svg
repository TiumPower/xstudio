<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Xstudio">
  <!-- Dấu X dựng từ bốn nhánh toả ra từ tâm — nhắc tới cây định hướng,
       thứ đặc trưng nhất của công cụ này. -->
  <defs>
    <linearGradient id="xs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E7AC9"/>
      <stop offset="1" stop-color="#1D4F94"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#xs-bg)"/>
  <g stroke="#fff" stroke-width="5.5" stroke-linecap="round" fill="none">
    <path d="M20 20 L30 30"/>
    <path d="M44 20 L34 30"/>
    <path d="M20 44 L30 34"/>
    <path d="M44 44 L34 34"/>
  </g>
  <circle cx="32" cy="32" r="4.6" fill="#fff"/>
  <g fill="#BBD3F2">
    <circle cx="19" cy="19" r="3.4"/>
    <circle cx="45" cy="19" r="3.4"/>
    <circle cx="19" cy="45" r="3.4"/>
    <circle cx="45" cy="45" r="3.4"/>
  </g>
</svg>
