upstream puma_xstudio {
  server unix:/var/www/xstudio/shared/tmp/sockets/puma.sock fail_timeout=0;
}

# HTTP → HTTPS
server {
  listen 80;
  server_name xstudio.czin.net;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name xstudio.czin.net;

  ssl_certificate     /etc/letsencrypt/live/xstudio.czin.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/xstudio.czin.net/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/xstudio/current/public;

  add_header X-Frame-Options        SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Tệp đính kèm tối đa 25MB (NFR) — chừa thêm biên.
  client_max_body_size 30M;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1000;

  location ^~ /assets/ {
    gzip_static on;
    expires 1y;
    add_header Cache-Control public;
    break;
  }

  location ^~ /rails/active_storage/ {
    proxy_pass         http://puma_xstudio;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location @puma {
    proxy_pass         http://puma_xstudio;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
    proxy_read_timeout 120s;
  }

  try_files $uri @puma;
}
