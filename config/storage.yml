test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# DigitalOcean Spaces — S3-compatible, nên dùng service S3 với endpoint riêng.
# Cùng khối này chạy được với mọi nhà cung cấp S3-compatible khác chỉ bằng cách
# đổi SPACES_ENDPOINT và SPACES_REGION.
#
# Bucket dùng CHUNG với các app khác trên cùng server, nên mỗi app ghi vào tiền
# tố riêng (xem lib/active_storage/service/prefixed_s3_service.rb).
spaces:
  service: PrefixedS3
  prefix: <%= ENV.fetch("SPACES_PREFIX", "xstudio") %>
  access_key_id:     <%= ENV["SPACES_KEY"] %>
  secret_access_key: <%= ENV["SPACES_SECRET"] %>
  region:            <%= ENV.fetch("SPACES_REGION", "sgp1") %>
  bucket:            <%= ENV["SPACES_BUCKET"] %>
  endpoint:          <%= ENV.fetch("SPACES_ENDPOINT") { "https://#{ENV.fetch('SPACES_REGION', 'sgp1')}.digitaloceanspaces.com" } %>
  force_path_style:  false
  # Tệp để RIÊNG TƯ; app phát đường dẫn ký tên có hạn khi cần tải.
  public: false

# Spaces là kho chính, đĩa máy chủ là bản sao.
#
# Không thừa: bin/xstudio_backup.sh nén shared/storage mỗi chủ nhật, và đó là
# bản sao thứ hai duy nhất của ảnh và chứng từ đính kèm. Tệp chỉ nằm trên
# Spaces thì bản sao lưu ấy rỗng — CSDL còn nguyên mà mọi tệp đính kèm biến
# mất, trong khi bản ghi vẫn trỏ tới chúng. DO Spaces không có versioning nên
# xoá nhầm trên đó là mất hẳn.
#
# Đặt SPACES_MIRROR_LOCAL=false để tắt nếu sau này dung lượng thành vấn đề.
spaces_mirrored:
  service: Mirror
  primary: spaces
  mirrors: [ local ]
